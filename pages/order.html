<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ShopEase - Order</title>

    <link rel="stylesheet"
          href="../style.css">

</head>

<body>

    <!-- Navigation Bar -->

    <header class="navbar">

        <div class="logo">
            ShopEase
        </div>

        <nav>

            <a href="../index.html">
                Home
            </a>

            <a href="products.html">
                Products
            </a>

            <a href="orders.html">
                My Orders
            </a>

            <a href="cart.html">
                Cart 🛒
            </a>

            <a href="login.html">
                Login
            </a>

        </nav>

    </header>


    <!-- Order Section -->

    <main>

        <section class="auth-section">

            <div class="auth-card">

                <h1>
                    Place Your Order
                </h1>

                <p>
                    Enter your delivery details.
                </p>


                <form id="orderForm">

                    <label for="orderName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="orderName"
                        placeholder="Enter your full name"
                        required
                    >


                    <label for="orderAddress">
                        Delivery Address
                    </label>

                    <input
                        type="text"
                        id="orderAddress"
                        placeholder="Enter your delivery address"
                        required
                    >


                    <label for="orderPhone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="orderPhone"
                        placeholder="Enter your phone number"
                        required
                    >


                    <h3>
                        Payment Method
                    </h3>

                    <p>
                        Cash on Delivery
                    </p>


                    <button type="submit">
                        Place Order
                    </button>

                </form>

            </div>

        </section>

    </main>


    <!-- Footer -->

    <footer>

        <p>
            © 2026 ShopEase. All Rights Reserved.
        </p>

    </footer>


    <script src="../script.js"></script>

</body>

</html>
