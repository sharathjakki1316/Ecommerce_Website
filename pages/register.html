<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ShopEase - Registration</title>

    <link rel="stylesheet"
          href="../style.css">

</head>

<body>

    <!-- Navigation Bar -->

    <header class="navbar">

        <div class="logo">
            ShopEase
        </div>

        <nav>

            <a href="../index.html">
                Home
            </a>

            <a href="login.html">
                Login
            </a>

        </nav>

    </header>


    <!-- Registration Section -->

    <main>

        <section class="auth-section">

            <div class="auth-card">

                <h1>
                    Create Your Account
                </h1>

                <p>
                    Register to start shopping with ShopEase.
                </p>


                <form id="registerForm">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >


                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >


                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >


                    <button type="submit">
                        Register
                    </button>

                </form>


                <p class="auth-link">

                    Already have an account?

                    <a href="login.html">
                        Login
                    </a>

                </p>

            </div>

        </section>

    </main>


    <script src="../script.js"></script>

</body>

</html>
