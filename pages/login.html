<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ShopEase - Login</title>

    <link rel="stylesheet"
          href="../style.css">

</head>

<body>

    <!-- Navigation Bar -->

    <header class="navbar">

        <div class="logo">
            ShopEase
        </div>

        <nav>

            <a href="../index.html">
                Home
            </a>

            <a href="register.html">
                Register
            </a>

        </nav>

    </header>


    <!-- Login Section -->

    <main>

        <section class="auth-section">

            <div class="auth-card">

                <h1>
                    Welcome Back
                </h1>

                <p>
                    Login to continue shopping with ShopEase.
                </p>


                <form id="loginForm">

                    <label for="loginEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        required
                    >


                    <label for="loginPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        required
                    >


                    <button type="submit">
                        Login
                    </button>

                </form>


                <p class="auth-link">

                    Don't have an account?

                    <a href="register.html">
                        Register
                    </a>

                </p>

            </div>

        </section>

    </main>


    <script src="../script.js"></script>

</body>

</html>
