<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Logout - ShopEase</title>

    <link rel="stylesheet"
          href="../style.css">

</head>


<body>

    <!-- Header -->

    <header class="navbar">

        <div class="logo">
            ShopEase
        </div>

        <nav>

            <a href="../index.html">
                Home
            </a>

            <a href="products.html">
                Products
            </a>

            <a href="orders.html">
                My Orders
            </a>

            <a href="cart.html">
                Cart 🛒
            </a>

            <a href="login.html">
                Login
            </a>

        </nav>

    </header>


    <!-- Logout Section -->

    <main>

        <section class="auth-section">

            <div class="auth-card">

                <h1>
                    Logout
                </h1>

                <p>
                    Are you sure you want to logout?
                </p>

                <button
                    onclick="logoutUser()">
                    Logout
                </button>

                <p class="auth-link">

                    <a href="../index.html">
                        Cancel
                    </a>

                </p>

            </div>

        </section>

    </main>


    <!-- Footer -->

    <footer>

        <p>
            © 2026 ShopEase. All Rights Reserved.
        </p>

    </footer>


    <script src="../script.js"></script>

</body>

</html>
