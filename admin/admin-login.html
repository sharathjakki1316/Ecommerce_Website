<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login - ShopEase</title>

    <link rel="stylesheet"
          href="../style.css">

</head>


<body>

    <!-- Header -->

    <header class="navbar">

        <div class="logo">
            ShopEase Admin
        </div>

        <nav>

            <a href="../index.html">
                Home
            </a>

        </nav>

    </header>


    <!-- Admin Login -->

    <main>

        <section class="auth-section">

            <div class="auth-card">

                <h1>
                    Admin Login
                </h1>

                <p>
                    Login to access the admin dashboard.
                </p>


                <form id="adminLoginForm">

                    <label for="adminEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="adminEmail"
                        placeholder="Enter admin email"
                        required
                    >


                    <label for="adminPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="adminPassword"
                        placeholder="Enter admin password"
                        required
                    >


                    <button type="submit">
                        Login
                    </button>

                </form>

            </div>

        </section>

    </main>


    <!-- Footer -->

    <footer>

        <p>
            © 2026 ShopEase. All Rights Reserved.
        </p>

    </footer>


    <script src="../script.js"></script>

</body>

</html>
