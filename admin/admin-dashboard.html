<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard - ShopEase</title>

    <link rel="stylesheet"
          href="../style.css">

</head>

<body>

    <!-- Header -->

    <header class="navbar">

        <div class="logo">
            ShopEase Admin
        </div>

        <nav>

            <a href="../index.html">
                Home
            </a>

        </nav>

    </header>


    <!-- Admin Dashboard -->

    <main>

        <section class="products-section">

            <h1>
                Admin Dashboard
            </h1>

            <p>
                Manage products, customers and orders.
            </p>


            <div class="product-container">

                <div class="product-card">

                    <h2>
                        Add Products
                    </h2>

                    <p>
                        Add new products to the store.
                    </p>

                    <a href="add-product.html">
                        <button>
                            Add Products
                        </button>
                    </a>

                </div>


                <div class="product-card">

                    <h2>
                        View Orders
                    </h2>

                    <p>
                        View customer orders.
                    </p>

                    <a href="view-orders.html">
                        <button>
                            View Orders
                        </button>
                    </a>

                </div>


                <div class="product-card">

                    <h2>
                        View Customers
                    </h2>

                    <p>
                        View registered customers.
                    </p>

                    <a href="view-customers.html">
                        <button>
                            View Customers
                        </button>
                    </a>

                </div>


                <div class="product-card">

                    <h2>
                        Logout
                    </h2>

                    <p>
                        Logout from the admin account.
                    </p>

                    <button onclick="logoutAdmin()">
                        Logout
                    </button>

                </div>

            </div>

        </section>

    </main>


    <!-- Footer -->

    <footer>

        <p>
            © 2026 ShopEase. All Rights Reserved.
        </p>

    </footer>


    <script src="../script.js"></script>

</body>

</html>
