<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Product - ShopEase</title>

    <link rel="stylesheet"
          href="../style.css">

</head>

<body>

    <!-- Header -->

    <header class="navbar">

        <div class="logo">
            ShopEase Admin
        </div>

        <nav>

            <a href="admin-dashboard.html">
                Dashboard
            </a>

            <a href="../index.html">
                Home
            </a>

        </nav>

    </header>


    <!-- Add Product Section -->

    <main>

        <section class="auth-section">

            <div class="auth-card">

                <h1>
                    Add Product
                </h1>

                <p>
                    Add a new product to the store.
                </p>


                <form id="addProductForm">

                    <label for="productName">
                        Product Name
                    </label>

                    <input
                        type="text"
                        id="productName"
                        placeholder="Enter product name"
                        required
                    >


                    <label for="productPrice">
                        Price
                    </label>

                    <input
                        type="number"
                        id="productPrice"
                        placeholder="Enter product price"
                        min="1"
                        required
                    >


                    <label for="productImage">
                        Image URL
                    </label>

                    <input
                        type="text"
                        id="productImage"
                        placeholder="Enter image path or URL"
                        required
                    >


                    <label for="productDescription">
                        Description
                    </label>

                    <input
                        type="text"
                        id="productDescription"
                        placeholder="Enter product description"
                        required
                    >


                    <button type="submit">
                        Add Product
                    </button>

                </form>

            </div>

        </section>

    </main>


    <!-- Footer -->

    <footer>

        <p>
            © 2026 ShopEase. All Rights Reserved.
        </p>

    </footer>


    <script src="../script.js"></script>

</body>

</html>
